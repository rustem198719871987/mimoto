# Каждое изменение в ветке main: тесты -> сборка установщика -> обновление сайта на сервере.
# Нужны секреты репозитория (Settings -> Secrets and variables -> Actions):
#   SSH_HOST, SSH_KNOWN_HOSTS, SSH_PRIVATE_KEY — их выдаёт установщик (файл /root/mimoto-github-secrets.txt).
name: Тесты и выкладка

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Автотесты
        run: npm test

      - name: Сборка установщика
        run: ./installer/build.sh

      - name: Выкладка на сервер
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::warning::Секреты сервера не заданы — тесты прошли, но выкладка пропущена."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/mimoto_deploy
          chmod 600 ~/.ssh/mimoto_deploy ~/.ssh/known_hosts
          ssh -i ~/.ssh/mimoto_deploy -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "root@$SSH_HOST" < dist/mimoto-install.sh
