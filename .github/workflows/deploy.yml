# Каждое изменение в ветке main: тесты -> сборка установщика -> публикация в релиз «installer».
# Сервер сам раз в 5 минут проверяет этот релиз и обновляет сайт (installer/autoupdate.sh).
# Если тесты не прошли, установщик не публикуется и сайт не меняется.
name: Тесты и выкладка

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # публикация установщика в релиз «installer»
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Автотесты
        run: npm test

      - name: Сборка установщика
        run: ./installer/build.sh

      # Постоянная ссылка на свежий установщик — чтобы ставить сайт одной командой прямо на сервере:
      #   curl -fLo mimoto-install.sh https://github.com/<владелец>/<репозиторий>/releases/download/installer/mimoto-install.sh
      - name: Публикация установщика
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view installer >/dev/null 2>&1 || gh release create installer \
            --title "Установщик MiMoto" --notes "Свежая версия установщика сайта. Обновляется автоматически при каждом изменении."
          gh release upload installer dist/mimoto-install.sh --clobber
